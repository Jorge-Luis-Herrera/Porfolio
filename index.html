<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portafolio de Jorge Luis Herrera — Desarrollador full-stack freelance y CTO en CubiTech. Aplicaciones web, herramientas de datos y automatización." />

  <style>
    /* Cross-document transition: the portfolio morphs into the CV page */
    @view-transition {
      navigation: auto;
    }
  </style>
  <script>
    // Apply saved theme before first paint to avoid flash
    try {
      var t = localStorage.getItem('portfolio-theme') || 'dark';
      document.documentElement.classList.add(t);
    } catch (e) {}
    // Never restore a previous scroll position: the site opens on the hero
    try {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    } catch (e) {}
  </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
</body>

</html>
